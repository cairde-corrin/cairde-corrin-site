<!-- The home page's scroll-driven film: the poster, the video and its frames. Fixed design, not in
     the editor; the words over it are the top of the home page in the editor. Without JS, or where
     scrubbing is not viable, this stays a static poster; site.js adds .scrub only when a runtime
     probe shows the engine can seek at speed. -->
