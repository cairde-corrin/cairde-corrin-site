# Decap CMS settings for News, the Gallery, Articles, the home page's social posts and the
# block-built pages. Served at
# /admin/config.yml.
#
# The CMS saves straight to the main branch, not to build. That is intended for
# that content and its photos only. Code, layouts, privacy, terms and the survey data
# still go through build and are merged by hand. See docs/CONTRIBUTING.md.

backend:
  name: git-gateway
  branch: main
  # Decap checks a Netlify status page on another host before every login.
  # This points the check at a file on this site instead, so the admin area
  # talks only to this site and to Netlify (and, when an editor uses a photo from
  # Wikimedia Commons, to the Commons API). It always reports "operational".
  status_endpoint: /admin/status.json

# Posts are saved as drafts first and go live only when someone presses Publish.
publish_mode: editorial_workflow

site_url: https://cairde-corrin.netlify.app
display_url: https://cairde-corrin.netlify.app
logo_url: /assets/img/logo.webp

media_folder: site/assets/uploads
public_folder: /assets/uploads
# Photos are shrunk to 2000 px and stripped of their metadata in the editor's browser before
# Decap uploads them (site/admin/index.html), and re-encoded again at build time
# (site/_includes/images.js). Each image field below caps uploads at 20 MB, only as a
# backstop against videos and very large files. Decap reads the cap per field: a
# top-level media_library block without a name is a config error.

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: news
    label: News
    label_singular: news post
    description: >-
      Posts for the News page on the website. Write a new post with the button
      above. Nothing you write appears on the website until it is published.
    folder: site/_content/news
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - label: Headline
        name: title
        widget: string
        hint: >-
          The title of the post, as it will appear at the top of the page and in
          the list of news. Keep it short. The web address of the post is made
          from this headline when you first save it, and does not change after.

      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        default: '{{now}}'
        hint: >-
          Filled in with today's date. Change it only if the post should carry another
          date. Newest posts appear first on the News page.

      - label: Written by
        name: author
        widget: string
        default: Cáirde Corrin
        hint: >-
          Leave this as Cáirde Corrin to post on behalf of the group, or put the
          name of the person who wrote it.

      - label: Short summary
        name: summary
        widget: text
        hint: >-
          One or two sentences about the post. This is what people see in the
          list of news, in search results, and when the post is shared on social
          media or in a message.

      - label: The post
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
        media_library: { config: { max_file_size: 20000000 } }
        hint: >-
          Write the post here. Use the buttons above the box for bold text,
          links, subheadings and lists. To put a photo between paragraphs, use
          the + button above the box and choose Image. The main photo and the
          extra photos go in the sections below.

      - label: Main photo
        name: hero
        widget: object
        required: false
        collapsed: true
        hint: >-
          Optional. One large photo shown under the summary. Leave this closed if
          the post has no main photo.
        fields:
          - label: Photo
            name: src
            widget: image
            media_library: { config: { max_file_size: 20000000 } }
            required: false
            choose_url: false
            hint: >-
              Choose or upload a photo. Only upload photographs the group took, or
              has the photographer's permission to publish: never pictures found
              online. Photos straight from a phone are fine: the website makes
              smaller copies and removes the location the phone stored in them.
          - label: Describe the photo for people who cannot see it
            name: alt
            widget: string
            required: false
            hint: >-
              One sentence saying what is in the photo, for example "Moss-covered
              branches of broadleaf trees coming into leaf". Screen readers read
              this aloud to blind visitors. Do not start with "A photo of".
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: Optional. A line of text shown under the photo.
          - { label: Who took this photo, name: by, widget: string, required: false, default: "Cáirde Corrin", hint: "Who took this photo. Leave it as Cáirde Corrin for the group's own. Only upload photographs the group took, or has the photographer's permission to publish: never pictures found online. A photo from Wikimedia Commons is credited for you, so leave this as it is for one of those." }

      - label: More photos
        name: gallery
        widget: list
        required: false
        collapsed: true
        label_singular: photo
        summary: "{{fields.alt}}"
        hint: >-
          Optional. Extra photos shown in a grid at the end of the post. Press
          "Add photo" for each one.
        fields:
          - label: Photo
            name: src
            widget: image
            media_library: { config: { max_file_size: 20000000 } }
            choose_url: false
            hint: >-
              Choose or upload a photo. Only upload photographs the group took, or
              has the photographer's permission to publish: never pictures found
              online. Photos straight from a phone are fine: the website makes
              smaller copies and removes the location the phone stored in them.
          - label: Describe the photo for people who cannot see it
            name: alt
            widget: string
            hint: >-
              One sentence saying what is in the photo. Screen readers read this
              aloud to blind visitors. Do not start with "A photo of".
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: Optional. A line of text shown under the photo.
          - { label: Who took this photo, name: by, widget: string, required: false, default: "Cáirde Corrin", hint: "Who took this photo. Leave it as Cáirde Corrin for the group's own. Only upload photographs the group took, or has the photographer's permission to publish: never pictures found online. A photo from Wikimedia Commons is credited for you, so leave this as it is for one of those." }

      - label: YouTube video
        name: youtube
        widget: string
        required: false
        pattern: ['^\s*([A-Za-z0-9_-]{11}|https://(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)/\S+)\s*$', 'Paste the address of the video on YouTube, starting https://, or just the 11 letters and numbers after "watch?v=".']
        hint: >-
          Optional. Only for videos Cáirde Corrin made and put on its own YouTube
          channel. On YouTube, press Share under the video, copy the address and
          paste it here. The post shows a still from the video with a play button;
          nothing loads from YouTube until a visitor presses play.

      - label: Date last changed
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        required: false
        hint: >-
          Optional. Only fill this in if you make an important change to a post
          after it has been published.

      - label: Take this off the website
        name: hidden
        widget: boolean
        required: false
        default: false
        hint: >-
          Tick this, save and publish to take the post off the website. It stays here in the
          editor: untick it and publish again to put it back.

  - name: gallery
    label: Gallery
    label_singular: photo
    description: >-
      Photographs for the Gallery page on the website. Add one with the button
      above. Nothing you add appears on the website until it is published.
    folder: site/_content/gallery
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: caption
    summary: "{{caption}}"
    sortable_fields: [taken, caption]
    fields:
      - label: Photo
        name: image
        widget: image
        media_library: { config: { max_file_size: 20000000 } }
        choose_url: false
        hint: >-
          Choose or upload a photo. Only upload photographs the group took, or has
          the photographer's permission to publish: never pictures found online.
          Photos straight from a phone are fine: the website makes smaller copies
          and removes the location the phone stored in them.
      - label: Describe the photo for people who cannot see it
        name: alt
        widget: string
        hint: >-
          One sentence saying what is in the photo. Screen readers read this aloud
          to blind visitors. Do not start with "A photo of".
      - { label: Who took this photo, name: by, widget: string, required: false, default: "Cáirde Corrin", hint: "Who took this photo. Leave it as Cáirde Corrin for the group's own. Only upload photographs the group took, or has the photographer's permission to publish: never pictures found online. A photo from Wikimedia Commons is credited for you, so leave this as it is for one of those." }
      - label: Caption
        name: caption
        widget: string
        hint: >-
          A line of text shown under the photo, for example where it was taken or
          what it shows. The web address of the entry is made from this when you
          first save it.
      - label: Date taken
        name: taken
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        required: false
        hint: >-
          Optional. The day the photo was taken. Dated photos are shown newest
          first; photos without a date come after them.

      - label: Take this off the website
        name: hidden
        widget: boolean
        required: false
        default: false
        hint: >-
          Tick this, save and publish to take the photo off the website. It stays here in the
          editor: untick it and publish again to put it back.

  - name: home
    label: Home page
    description: >-
      Parts of the home page you can change. Nothing you change appears on the
      website until it is published.
    files:
      - name: social
        label: Social media posts
        file: site/_data/social.json
        fields:
          - label: Posts
            name: posts
            widget: list
            required: false
            max: 3
            label_singular: post
            summary: "{{fields.caption}}"
            hint: >-
              Up to three Instagram or Facebook posts to show on the home page, as
              cards that link to the post. Nothing is loaded from Instagram or
              Facebook: the card shows only the caption you type here. Leave the
              list empty and the home page shows no social section at all. Once the
              automatic Instagram feed is set up, the home page shows that instead and
              these cards are not shown.
            fields:
              - label: Address of the post
                name: url
                widget: string
                pattern: ['^\s*https://(www\.|m\.)?(instagram\.com|facebook\.com)/\S+\s*$', 'Paste the full address of one Instagram or Facebook post, starting https://']
                hint: >-
                  Open the post, use Share, then Copy link, and paste it here. It
                  must be a post on Instagram or Facebook.
              - label: Caption
                name: caption
                widget: string
                pattern: ['^.{1,160}$', 'Keep the caption to one short line, under 160 characters.']
                hint: One short line saying what the post is about. This is what the card shows.

  # Every page below is an ordered list of blocks (site/_includes/blocks.js draws them).
  # The top of each page is a fixed field, not a block, so a page always has exactly one,
  # always first. Each block is defined once here (the &anchors) and reused by name (*alias).
  - name: pages
    label: Pages
    label_singular: page
    description: >-
      Every page of the website apart from News, the gallery, Articles, Privacy and Terms.
      Each page has a fixed top, then a list of blocks you can add, remove, drag into a new
      order, copy and change. Figures (heights, areas, distances) are ordinary words: if two
      pages end up giving the same figure differently, whoever maintains the website is
      warned. Nothing you change appears on the website until it is published.
    editor: { preview: false }
    files:
      - name: home
        label: "Home page"
        file: site/_data/pages/home.json
        fields:
          - &about_subject
            label: "About this page (for search engines and sharing)"
            name: page
            widget: object
            collapsed: true
            fields:
              - &page_title { label: "Page title", name: title, widget: string, hint: "Shown in search results, on the browser tab and when someone shares the page." }
              - &page_summary { label: "Summary", name: description, widget: text, hint: "One or two sentences. Shown under the title in search results and when someone shares the page." }
              - label: "What this page is about"
                name: subject
                widget: object
                hint: "Search engines are told the page describes this."
                fields:
                  - { label: "Its name", name: name, widget: string }
                  - { label: "A sentence describing it", name: description, widget: text }
          - label: "The top of the page (the film)"
            name: hero
            widget: object
            hint: "The words over the film at the top of the home page. The film itself is not changed here."
            fields:
              - { label: "Small line at the top", name: strap, widget: string }
              - { label: "Title", name: title, widget: string }
              - { label: "Second line of the title, in italics", name: title_second, widget: string, required: false }
              - { label: "Line under the title", name: intro, widget: text }
              - { label: "Second line of the film", name: line2, widget: text }
              - { label: "Third line of the film", name: line3, widget: text }
          - label: "Blocks (the rest of the page)"
            name: blocks
            widget: list
            label_singular: block
            hint: "Each Text block starts a new band across the page; the blocks after it sit in the same band until the next Text block."
            types:
              - label: "Text"
                name: text
                widget: object
                summary: "{{fields.heading}}"
                fields:
                  - &eyebrow { label: "Small line above the heading", name: eyebrow, widget: string, required: false, hint: "Optional. Shown in small capitals." }
                  - &heading { label: "Heading", name: heading, widget: text, required: false, hint: "Optional. Press Enter to start a new line." }
                  - &paragraphs { label: "Paragraphs", name: text, widget: text, required: false, hint: "Leave an empty line between paragraphs. Put `*asterisks*` round words for italics. To make a link, write `[the words](/trails/)` for a page on this site or `[the words](https://...)` for another site." }
                  - label: "Background of the band"
                    name: background
                    widget: select
                    default: light
                    options: [{ label: "Light", value: light }, { label: "Dark", value: dark }, { label: "Lightly tinted", value: tint }]
                  - &copy { label: "Make a copy of this block when I save", name: copy, widget: boolean, required: false, default: false, hint: "Tick, then save: a copy appears straight after this block, ready to change. The tick clears itself." }
              - &b_figures
                label: "Figure box"
                name: figures
                widget: object
                fields:
                  - label: "Figures"
                    name: items
                    widget: list
                    label_singular: figure
                    summary: "{{fields.label}}: {{fields.value}} {{fields.unit}}"
                    fields: &figure_fields
                      - { label: "What it is", name: label, widget: string, hint: "For example: Catchment area." }
                      - { label: "Put \"about\" in front of the figure", name: about, widget: boolean, required: false, default: false }
                      - { label: "The figure", name: value, widget: string, hint: "For example: 3.6" }
                      - { label: "Unit", name: unit, widget: string, required: false, hint: "Optional. For example: km² or ha." }
                  - *copy
              - &b_image
                label: "Single image"
                name: image
                widget: object
                summary: "{{fields.caption}}"
                fields:
                  - &photo
                    label: "Photo"
                    name: photo
                    widget: sitephoto
                    media_library: { config: { max_file_size: 20000000 } }
                    choose_url: false
                    hint: "Choose a photo already on the website, upload one the group took (or has permission to publish), or use a photo from Wikimedia Commons by its address, which brings its credit with it. Never upload a picture found online. Photos straight from a phone are fine: the website makes smaller copies and removes the location and phone details."
                  - &alt { label: "What the photo shows", name: alt, widget: string, hint: "For people who cannot see the photo: what is in it, in one sentence." }
                  - &by { label: "Who took this photo", name: by, widget: string, required: false, default: "Cáirde Corrin", hint: "Who took this photo. Leave it as Cáirde Corrin for the group's own. Only upload photographs the group took, or has the photographer's permission to publish: never pictures found online. A photo from Wikimedia Commons is credited for you, so leave this as it is for one of those." }
                  - { label: "Caption", name: caption, widget: string, required: false }
                  - *copy
              - &b_pair
                label: "Two photos side by side"
                name: pair
                widget: object
                fields:
                  - label: "The two photos"
                    name: items
                    widget: list
                    label_singular: photo
                    min: 2
                    max: 2
                    fields:
                      - *photo
                      - *alt
                      - *by
                      - { label: "Small line under the photo", name: meta, widget: string, required: false, hint: "Optional. For example the height and time it was taken." }
                      - { label: "Caption", name: caption, widget: string, required: false }
                  - *copy
              - &b_carousel
                label: "Photo carousel"
                name: carousel
                widget: object
                summary: "{{fields.label}}"
                fields:
                  - { label: "What the photos are", name: label, widget: string, default: "Photographs", hint: "Read out to people using a screen reader, for example: Photographs from the Glenabo catchment." }
                  - { label: "Show a link to the gallery underneath", name: gallery_link, widget: boolean, required: false, default: false, hint: "The link only appears once the gallery has photos." }
                  - &photo_items
                    label: "Photos"
                    name: items
                    widget: list
                    label_singular: photo
                    summary: "{{fields.alt}}"
                    fields:
                      - *photo
                      - *alt
                      - *by
                      - { label: "Small line under the photo", name: caption, widget: string, required: false, hint: "Optional. For example the height and time it was taken." }
                  - *copy
              - &b_grid
                label: "Photo grid"
                name: grid
                widget: object
                fields:
                  - *photo_items
                  - *copy
              - &b_steps
                label: "Numbered points"
                name: steps
                widget: object
                fields:
                  - label: "Points"
                    name: items
                    widget: list
                    label_singular: point
                    summary: "{{fields.label}} {{fields.heading}}"
                    fields:
                      - { label: "Number or label", name: label, widget: string, required: false, hint: "For example: Strand 1, Phase 2 or 03." }
                      - { label: "Heading", name: heading, widget: string }
                      - { label: "Text", name: text, widget: text, required: false }
                      - &link_text { label: "Link words", name: link_text, widget: string, required: false, hint: "Optional. The words people click, for example: See the trail →" }
                      - &link { label: "Link to", name: link, widget: string, required: false, hint: "A page on this site, starting with / (for example /trails/), or a full address starting with https://" }
                  - *copy
              - &b_cards
                label: "Cards"
                name: cards
                widget: object
                fields:
                  - label: "Cards"
                    name: items
                    widget: list
                    label_singular: card
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Small label at the top", name: kicker, widget: string, required: false }
                      - { label: "Title", name: title, widget: string }
                      - { label: "Text", name: text, widget: text, required: false }
                      - { label: "Photo", name: photo, widget: sitephoto, required: false, media_library: { config: { max_file_size: 20000000 } }, choose_url: false, hint: "Optional. For a plant or animal, a photo from Wikimedia Commons is often best: use its address and its credit comes with it." }
                      - { label: "What the photo shows", name: alt, widget: string, required: false, hint: "Needed if there is a photo: what is in it, in one sentence." }
                      - *by
                      - *link_text
                      - *link
                  - *copy
              - &b_links
                label: "List of links"
                name: links
                widget: object
                fields:
                  - label: "Links"
                    name: items
                    widget: list
                    label_singular: link
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - { label: "Web address", name: url, widget: string, pattern: ['^https://', 'Use the full address, starting with https://'] }
                  - *copy
              - &b_note
                label: "Note box"
                name: note
                widget: object
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Heading", name: heading, widget: string, required: false }
                  - { label: "Text", name: text, widget: text, hint: "Leave an empty line between paragraphs." }
                  - *link_text
                  - *link
                  - { label: "Folded away until someone taps the heading", name: folded, widget: boolean, required: false, default: false }
                  - *copy
              - &b_quote
                label: "Pull quote"
                name: quote
                widget: object
                fields:
                  - { label: "The quotation", name: text, widget: text, hint: "Without quotation marks: they are added." }
                  - { label: "Who said it, or where it is from", name: source, widget: string, required: false }
                  - *copy
              - &b_button
                label: "Button link"
                name: button
                widget: object
                summary: "{{fields.text}}"
                fields:
                  - { label: "Words on the button", name: text, widget: string }
                  - { label: "Link to", name: url, widget: string, hint: "A page on this site, starting with / (for example /about/), a full address starting with https://, or mailto: and an email address." }
                  - *copy
              - &b_video
                label: "YouTube video"
                name: video
                widget: object
                summary: "{{fields.title}}"
                fields:
                  - { label: "YouTube address", name: url, widget: string, hint: "Copy it from YouTube's Share button. Nothing is loaded from YouTube until a visitor presses play." }
                  - { label: "Title of the video", name: title, widget: string }
                  - *copy
              - &b_audio
                label: "Recording"
                name: audio
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string, default: "Listen" }
                  - { label: "About the recording", name: text, widget: text, required: false }
                  - { label: "What the recording is", name: label, widget: string, hint: "Read out to people using a screen reader." }
                  - &audio_file { label: "The recording", name: file, widget: string, hint: "A recording already on the website, such as /assets/audio/stop-1.mp3. New recordings are added by whoever looks after the website, who first removes the phone's location and details from them." }
                  - *copy
              - &b_story
                label: "Folklore story"
                name: story
                widget: object
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Short name for links to this story", name: anchor, widget: string, required: false, hint: "Optional. Used in links such as /folklore/#glenabo. Leave empty to make one from the title." }
                  - { label: "Summary", name: summary, widget: text, hint: "In your own words. Leave an empty line between paragraphs." }
                  - { label: "What it names", name: place, widget: text, required: false, hint: "Optional. For example: Names Corrin, and places it about three miles from Fermoy." }
                  - { label: "Volume", name: volume, widget: string, hint: "The source is required by the licence the story is used under: the website will not publish a story without it." }
                  - { label: "Page", name: page, widget: string, hint: "For example 148, or 149-150." }
                  - { label: "Where it was collected", name: school, widget: string, hint: "For example: Adair, Fermoy." }
                  - { label: "County", name: county, widget: string, default: "Co. Cork" }
                  - { label: "Collected by", name: collector, widget: string, required: false }
                  - { label: "The story on dúchas.ie", name: link, widget: string, pattern: ['^https://www\.duchas\.ie/', 'The address of the story on dúchas.ie, starting with https://www.duchas.ie/'] }
                  - *copy
              - &b_species
                label: "Species list"
                name: species
                widget: object
                fields:
                  - label: "Species"
                    name: items
                    widget: list
                    label_singular: species
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Common name", name: name, widget: string, hint: "Add only a species recorded in the Glenabo-Corrin catchment on one of the group's own surveys, not one that is merely likely to be there." }
                      - { label: "Scientific name", name: scientific, widget: string, hint: "Shown in italics, as the identification gave it. If only the family could be identified, give the family and tick the box below." }
                      - { label: "Only the family is known", name: family, widget: boolean, required: false, default: false }
                      - { label: "Named by", name: authority, widget: string, required: false, hint: "Optional. The botanist's abbreviation after the name, for example L." }
                      - { label: "Note after the name", name: flag, widget: string, required: false, hint: "Optional. For example: proposed determination." }
                      - { label: "Photo", name: photo, widget: sitephoto, required: false, media_library: { config: { max_file_size: 20000000 } }, choose_url: false, hint: "Optional. A reference photo of the species, usually from Wikimedia Commons by its address (its credit comes with it), unless the group photographed this very plant." }
                      - { label: "What the photo shows", name: alt, widget: string, required: false, hint: "Needed if there is a photo." }
                      - *by
                      - { label: "Description", name: description, widget: text, required: false, hint: "In your own words. Say how it was identified (for example: identified with Pl@ntNet and confirmed from photographs by ...), and whether the identification is confident. Do not copy text from other websites." }
                      - { label: "Its page in the BSBI Plant Atlas", name: atlas, widget: string, required: false, hint: "Optional. The full address, starting with https://" }
                      - label: "Where and when it was recorded"
                        name: records
                        widget: list
                        label_singular: record
                        summary: "{{fields.trail}} {{fields.date}}"
                        hint: "Each time it was recorded: where in the catchment, and the date."
                        fields:
                          - { label: "Trail", name: trail, widget: string, hint: "Where in the catchment it was found, for example: Corrin Loop." }
                          - { label: "Date", name: date, widget: string, required: false, hint: "For example: 15 August 2026." }
                  - *copy
              - &b_recordings
                label: "List of recordings"
                name: recordings
                widget: object
                fields:
                  - { label: "The day they were made", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false }
                  - label: "Recordings"
                    name: items
                    widget: list
                    label_singular: recording
                    summary: "{{fields.start}}"
                    fields:
                      - { label: "Started at", name: start, widget: string, hint: "For example: 07:10:03" }
                      - { label: "Ended at", name: end, widget: string, required: false }
                      - { label: "Length", name: duration, widget: string, hint: "Minutes and seconds, for example 7:34" }
                      - { label: "Short note", name: note, widget: string, required: false, hint: "Optional. For example: also on stop 1." }
                      - *audio_file
                  - *copy
              - &b_films
                label: "Films"
                name: films
                widget: object
                fields:
                  - label: "Films"
                    name: items
                    widget: list
                    label_singular: film
                    summary: "{{fields.date}}"
                    fields:
                      - label: "YouTube address"
                        name: youtube
                        widget: string
                        required: false
                        pattern: ['^\s*([A-Za-z0-9_-]{11}|https://(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)/\S+)\s*$', 'Paste the address of the video on YouTube, starting https://, or just the 11 letters and numbers after "watch?v=".']
                        hint: "Only for films Cáirde Corrin made and put on its own YouTube channel. On YouTube, press Share under the video, copy the address and paste it here. The page shows a still from the film with a play button; nothing loads from YouTube until a visitor presses play. (The films already on this page are kept on the website itself, and have no address here.)"
                      - { label: "What the film is called", name: title, widget: string, required: false, hint: "Optional. Read out on the play button. Without it, the film is called by its date." }
                      - { label: "Filmed on", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false }
                      - { label: "Length", name: duration, widget: string, required: false, hint: "Optional. Minutes and seconds, for example 0:23" }
                      - { label: "Film kept on the website", name: file, widget: hidden, required: false }
                      - { label: "Its still picture", name: poster, widget: hidden, required: false }
                  - *copy
              - label: "Posts from the group"
                name: social
                widget: object
                hint: "The group's Instagram posts, or the posts listed under Home page → Social media posts. Shown only when there are some. It can appear once."
                fields:
                  - *eyebrow
                  - *heading
      - name: about
        label: "About"
        file: site/_data/pages/about.json
        fields: &standard_fields
          - &about_plain
            label: "About this page (for search engines and sharing)"
            name: page
            widget: object
            collapsed: true
            fields: [*page_title, *page_summary]
          - &hero
            label: "The top of the page"
            name: hero
            widget: object
            fields:
              - { label: "Small line above the title", name: eyebrow, widget: string }
              - { label: "Title", name: title, widget: text, hint: "Press Enter to start a new line." }
              - { label: "Opening paragraph", name: intro, widget: text, required: false }
          - &blocks
            label: "Blocks (the rest of the page)"
            name: blocks
            widget: list
            label_singular: block
            types:
              - &b_text
                label: "Text"
                name: text
                widget: object
                summary: "{{fields.heading}}"
                fields:
                  - *eyebrow
                  - *heading
                  - *paragraphs
                  - label: "Style of the paragraphs"
                    name: style
                    widget: select
                    default: normal
                    required: false
                    options: [{ label: "Ordinary", value: normal }, { label: "Small print, such as where information comes from", value: small }, { label: "A short label, such as In development", value: label }]
                  - label: "Space above"
                    name: gap
                    widget: select
                    default: none
                    required: false
                    options: [{ label: "None", value: none }, { label: "A little", value: small }, { label: "More", value: medium }, { label: "Most", value: large }]
                  - *copy
              - *b_figures
              - *b_image
              - *b_pair
              - *b_carousel
              - *b_grid
              - *b_steps
              - *b_cards
              - *b_links
              - *b_note
              - *b_quote
              - *b_button
              - *b_video
              - *b_audio
              - *b_story
              - *b_species
              - *b_recordings
              - *b_films
      - { name: links, label: "Links", file: site/_data/pages/links.json, fields: *standard_fields }
      - { name: new_spaces, label: "New spaces", file: site/_data/pages/new_spaces.json, fields: *standard_fields }
      - { name: corrin_moor, label: "New spaces: Corrin moorland", file: site/_data/pages/corrin_moor.json, fields: *standard_fields }
      - { name: corrin_wetlands, label: "New spaces: Corrin wetlands", file: site/_data/pages/corrin_wetlands.json, fields: *standard_fields }
      - { name: water, label: "Water and ecosystems", file: site/_data/pages/water.json, fields: *standard_fields }
      - { name: recordings, label: "Recordings", file: site/_data/pages/recordings.json, fields: *standard_fields }
      - name: species
        label: "Species"
        file: site/_data/pages/species.json
        fields: &listing_fields
          - label: "About this page (for search engines and sharing)"
            name: page
            widget: object
            collapsed: true
            fields:
              - *page_title
              - *page_summary
              - label: "What this page is about"
                name: subject
                widget: object
                hint: "Search engines are told the page lists these."
                fields:
                  - { label: "Name of the list", name: name, widget: string, hint: "For example: Species recorded on the trails." }
          - *hero
          - *blocks
      - { name: folklore, label: "Folklore", file: site/_data/pages/folklore.json, fields: *listing_fields }
      - name: trails
        label: "Trails"
        file: site/_data/pages/trails.json
        fields:
          - *about_subject
          - *hero
          - label: "Blocks (the rest of the page)"
            name: blocks
            widget: list
            label_singular: block
            hint: "The map, the list of stops and the walked loop can each appear once."
            types:
              - label: "Interactive map"
                name: map
                widget: object
                hint: "The map of the catchment, the walked loop and the recorded stops. It can appear once."
                fields:
                  - { label: "Line under the map", name: note, widget: string, required: false }
              - label: "List of stops"
                name: stops
                widget: object
                hint: "Every stop from 1 to 10, filled in from the stops' own pages. It can appear once."
                fields:
                  - { label: "Heading", name: heading, widget: string, default: "The stops" }
                  - { label: "Note beside the list", name: note, widget: text, required: false }
                  - { label: "Figures beside the list", name: figures, widget: list, required: false, label_singular: figure, summary: "{{fields.label}}: {{fields.value}} {{fields.unit}}", fields: *figure_fields }
              - label: "Walked route"
                name: route
                widget: object
                summary: "{{fields.name}}"
                hint: "A route the group has walked, from its GPS track: it is drawn on the map, with its own elevation profile and a download. Stretches walked twice are taken out, and the times and names in the file are removed before it is uploaded."
                fields:
                  - { label: "Name of the route", name: name, widget: string, hint: "For example: The Corrin Hill path." }
                  - { label: "About the route", name: text, widget: text, required: false, hint: "Leave an empty line between paragraphs." }
                  - { label: "The GPS track", name: track, widget: file, choose_url: false, media_library: { config: { max_file_size: 5000000 } }, hint: "The walk exported from the phone app as a GPX file. If the website cannot use it, it says why and the trails page stays as it was." }
                  - *copy
              - label: "The walked loop"
                name: walked
                widget: object
                hint: "The group's walked loop, its elevation profile and the GPS download. Its content comes from the checked GPS track and cannot be changed here (see the editor guide). It can appear once."
                fields:
                  - { label: "Nothing to fill in", name: none, widget: string, required: false, hint: "This block has no settings." }
              - *b_text
              - *b_figures
              - *b_image
              - *b_note
              - *b_button
      - name: credits
        label: "Credits"
        file: site/_data/pages/credits.json
        fields:
          - *about_plain
          - *hero
          - label: "Blocks (the rest of the page)"
            name: blocks
            widget: list
            label_singular: block
            types:
              - label: "Credits list"
                name: credits
                widget: object
                fields:
                  - label: "Entries"
                    name: items
                    widget: list
                    label_singular: entry
                    hint: "Credits a licence requires can be moved but not changed. If one is removed, it is added back at the end of the page, because the licences the photographs, maps and stories are used under require it."
                    types:
                      - label: "Credit"
                        name: credit
                        widget: object
                        summary: "{{fields.heading}}"
                        fields:
                          - { label: "Heading", name: heading, widget: string }
                          - { label: "Text", name: text, widget: text, hint: "Leave an empty line between paragraphs." }
                      - label: "Credits a licence requires"
                        name: required
                        widget: object
                        summary: "{{fields.group}}"
                        fields:
                          - label: "Which credits"
                            name: group
                            widget: select
                            options:
                              - { label: "Elevation data (for the maps)", value: elevation }
                              - { label: "Species records", value: species-records }
                              - { label: "Species reference photographs", value: species-photos }
                              - { label: "Invasive species photographs", value: invasive-photos }
                              - { label: "Folklore", value: folklore }
                              - { label: "Photographs from Wikimedia Commons", value: commons-photos }
                  - *copy
              - *b_text
              - *b_note
      - name: stop_1
        label: "Stop 01"
        file: site/_data/pages/stop_1.json
        fields: &stop_fields
          - label: "About this page (for search engines and sharing)"
            name: page
            widget: object
            collapsed: true
            fields:
              - { label: "Name of the stop", name: title, widget: string, required: false, hint: "Shown on the trails page, in search results and on the browser tab, after the stop's number." }
              - { label: "Summary", name: description, widget: text, required: false, hint: "One or two sentences. Shown under the title in search results and when someone shares the page." }
          - label: "The top of the page"
            name: hero
            widget: object
            hint: "A stop with no title shows as \"Not yet surveyed\" and is kept out of search engines. Give it a title, and fill in its name and summary above, its photo, position, height, direction and time, and it goes live: it appears on the trails page, on the map and in search engines."
            fields:
              - { label: "Small line above the title", name: eyebrow, widget: string }
              - { label: "Title", name: title, widget: text, required: false, hint: "Press Enter to start a new line. Leave empty until the stop is ready." }
              - { label: "Photo", name: photo, widget: sitephoto, required: false, media_library: { config: { max_file_size: 20000000 } }, hint: "The photo taken at the stop, by the group." }
              - { label: "What the photo shows", name: alt, widget: string, required: false, hint: "For people who cannot see the photo: what is in it, in one sentence." }
              - *by
              - { label: "Latitude", name: latitude, widget: string, required: false, hint: "Degrees north, for example 52.12752" }
              - { label: "Longitude", name: longitude, widget: string, required: false, hint: "Degrees east, so negative here, for example -8.29878" }
              - { label: "Height in metres", name: elevation, widget: string, required: false, hint: "Above sea level, to the nearest 5 metres, for example 60" }
              - { label: "Facing", name: facing, widget: string, required: false, hint: "The compass direction the photo faces, in degrees, for example 159" }
              - { label: "Recorded", name: recorded, widget: string, required: false, hint: "When, for example: 11 Apr 2026, 07:10" }
          - *blocks
      - { name: stop_2, label: "Stop 02", file: site/_data/pages/stop_2.json, fields: *stop_fields }
      - { name: stop_3, label: "Stop 03", file: site/_data/pages/stop_3.json, fields: *stop_fields }
      - { name: stop_4, label: "Stop 04", file: site/_data/pages/stop_4.json, fields: *stop_fields }
      - { name: stop_5, label: "Stop 05", file: site/_data/pages/stop_5.json, fields: *stop_fields }
      - { name: stop_6, label: "Stop 06", file: site/_data/pages/stop_6.json, fields: *stop_fields }
      - { name: stop_7, label: "Stop 07", file: site/_data/pages/stop_7.json, fields: *stop_fields }
      - { name: stop_8, label: "Stop 08", file: site/_data/pages/stop_8.json, fields: *stop_fields }
      - { name: stop_9, label: "Stop 09", file: site/_data/pages/stop_9.json, fields: *stop_fields }
      - { name: stop_10, label: "Stop 10", file: site/_data/pages/stop_10.json, fields: *stop_fields }

  - name: articles
    label: Articles
    label_singular: article
    description: >-
      Articles about Cáirde Corrin or the catchment published elsewhere: newspapers,
      magazines, other websites. Each appears on the Articles page as a card that links to
      the original. Nothing you add appears on the website until it is published.
    folder: site/_content/articles
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{publication}})"
    sortable_fields: [date, title]
    editor: { preview: false }
    fields:
      - { label: Headline of the article, name: title, widget: string, hint: "Exactly as the publication gave it." }
      - { label: Published in, name: publication, widget: string, hint: "The newspaper, magazine or website, for example The Avondhu." }
      - { label: Written by, name: author, widget: string, required: false, hint: "Optional. The journalist or author, if named." }
      - label: Date it was published
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        default: '{{now}}'
      - label: Address of the article
        name: url
        widget: string
        pattern: ['^https://\S+$', 'Paste the full address of the article, starting https://']
      - label: Summary in your own words
        name: summary
        widget: text
        hint: >-
          Two or three sentences saying what the article is about, written by you. Do not
          copy text from the article: it belongs to the publication. The card links to the
          original for anyone who wants to read it.
      - label: One short line quoted from the article (optional)
        name: quote
        widget: string
        required: false
        pattern: ['^.{0,200}$', 'Keep the quoted line short: one sentence, under 200 characters.']
        hint: >-
          Optional. At most one short sentence, copied exactly. It is shown in quotation marks
          with the publication's name. Never more than this.

      - label: Take this off the website
        name: hidden
        widget: boolean
        required: false
        default: false
        hint: >-
          Tick this, save and publish to take the article off the website. It stays here in the
          editor: untick it and publish again to put it back.
