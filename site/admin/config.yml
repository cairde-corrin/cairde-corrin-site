      - name: stop_3
        label: "Stop 03"
        file: site/_data/pages/stop_3.json
        fields:
          - label: "Under \"The mossy stand.\""
            name: p1
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics. Figures such as heights, areas and distances are ordinary words: if you change one, change it on the other pages that give it too."
          - label: "Under \"The mossy stand.\""
            name: p2
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."

  - name: articles
    label: Articles
    label_singular: article
    description: >-
      Articles about Cáirde Corrin or the catchment published elsewhere: newspapers,
      magazines, other websites. Each appears on the Articles page as a card that links to
      the original. Nothing you add appears on the website until it is published.
    folder: site/_content/articles
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{publication}})"
    sortable_fields: [date, title]
    editor: { preview: false }
    fields:
      - { label: Headline of the article, name: title, widget: string, hint: "Exactly as the publication gave it." }
      - { label: Published in, name: publication, widget: string, hint: "The newspaper, magazine or website, for example The Avondhu." }
      - { label: Written by, name: author, widget: string, required: false, hint: "Optional. The journalist or author, if named." }
      - label: Date it was published
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        default: '{{now}}'
      - label: Address of the article
        name: url
        widget: string
        pattern: ['^https://\S+$', 'Paste the full address of the article, starting https://']
      - label: Summary in your own words
        name: summary
        widget: text
        hint: >-
          Two or three sentences saying what the article is about, written by you. Do not
          copy text from the article: it belongs to the publication. The card links to the
          original for anyone who wants to read it.
      - label: One short line quoted from the article (optional)
        name: quote
        widget: string
        required: false
        pattern: ['^.{0,200}$', 'Keep the quoted line short: one sentence, under 200 characters.']
        hint: >-
          Optional. At most one short sentence, copied exactly. It is shown in quotation marks
          with the publication's name. Never more than this.

      - label: Take this off the website
        name: hidden
        widget: boolean
        required: false
        default: false
        hint: >-
          Tick this, save and publish to take the article off the website. It stays here in the
          editor: untick it and publish again to put it back.
