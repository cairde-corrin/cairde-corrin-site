# Decap CMS settings for News, the Gallery and the home page's social posts. Served at
# /admin/config.yml.
#
# The CMS saves straight to the main branch, not to build. That is intended for
# that content and its photos only. Code, layouts and every other page still go
# through build and are merged by hand. See docs/CONTRIBUTING.md.

backend:
  name: git-gateway
  branch: main
  # Decap checks a Netlify status page on another host before every login.
  # This points the check at a file on this site instead, so the admin area
  # talks only to this site and to Netlify. It always reports "operational".
  status_endpoint: /admin/status.json

# Posts are saved as drafts first and go live only when someone presses Publish.
publish_mode: editorial_workflow

site_url: https://cairde-corrin.netlify.app
display_url: https://cairde-corrin.netlify.app
logo_url: /assets/img/logo.webp

media_folder: site/assets/uploads
public_folder: /assets/uploads
# Uploads are never published as they are: the build re-encodes each one, which removes
# its GPS position and other metadata (site/_includes/images.js). Each image field below
# caps uploads at 20 MB, only as a backstop against videos and very large files; phone
# photos here run 2.4 to 12.5 MB. Decap reads the cap per field: a top-level
# media_library block without a name is a config error.

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: news
    label: News
    label_singular: news post
    description: >-
      Posts for the News page on the website. Write a new post with the button
      above. Nothing you write appears on the website until it is published.
    folder: site/_content/news
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - label: Headline
        name: title
        widget: string
        hint: >-
          The title of the post, as it will appear at the top of the page and in
          the list of news. Keep it short. The web address of the post is made
          from this headline when you first save it, and does not change after.

      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        hint: >-
          The date shown on the post. Newest posts appear first on the News page.

      - label: Written by
        name: author
        widget: string
        default: Cáirde Corrin
        hint: >-
          Leave this as Cáirde Corrin to post on behalf of the group, or put the
          name of the person who wrote it.

      - label: Short summary
        name: summary
        widget: text
        hint: >-
          One or two sentences about the post. This is what people see in the
          list of news, in search results, and when the post is shared on social
          media or in a message.

      - label: The post
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
        media_library: { config: { max_file_size: 20000000 } }
        hint: >-
          Write the post here. Use the buttons above the box for bold text,
          links, subheadings and lists. To put a photo between paragraphs, use
          the + button above the box and choose Image. The main photo and the
          extra photos go in the sections below.

      - label: Main photo
        name: hero
        widget: object
        required: false
        collapsed: true
        hint: >-
          Optional. One large photo shown under the summary. Leave this closed if
          the post has no main photo.
        fields:
          - label: Photo
            name: src
            widget: image
            media_library: { config: { max_file_size: 20000000 } }
            required: false
            choose_url: false
            hint: >-
              Choose or upload a photo. Please use a photo you took yourself, or
              one you have permission to use. Photos straight from a phone are
              fine: the website makes smaller copies and removes the location
              the phone stored in them.
          - label: Describe the photo for people who cannot see it
            name: alt
            widget: string
            required: false
            hint: >-
              One sentence saying what is in the photo, for example "Moss-covered
              branches of broadleaf trees coming into leaf". Screen readers read
              this aloud to blind visitors. Do not start with "A photo of".
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: Optional. A line of text shown under the photo.
          - label: Width in pixels
            name: width
            widget: number
            value_type: int
            required: false
            hint: >-
              Leave this empty. It is worked out automatically for photos
              uploaded here.
          - label: Height in pixels
            name: height
            widget: number
            value_type: int
            required: false
            hint: Leave this empty. It is worked out automatically for photos uploaded here.
          - label: Other sizes of the same photo
            name: srcset
            widget: list
            required: false
            collapsed: true
            hint: >-
              Leave this empty. The smaller sizes of an uploaded photo are made
              automatically.
            field: { label: Size, name: size, widget: string }

      - label: More photos
        name: gallery
        widget: list
        required: false
        collapsed: true
        label_singular: photo
        summary: "{{fields.alt}}"
        hint: >-
          Optional. Extra photos shown in a grid at the end of the post. Press
          "Add photo" for each one.
        fields:
          - label: Photo
            name: src
            widget: image
            media_library: { config: { max_file_size: 20000000 } }
            choose_url: false
            hint: >-
              Choose or upload a photo. Please use a photo you took yourself, or
              one you have permission to use. Photos straight from a phone are
              fine: the website makes smaller copies and removes the location
              the phone stored in them.
          - label: Describe the photo for people who cannot see it
            name: alt
            widget: string
            hint: >-
              One sentence saying what is in the photo. Screen readers read this
              aloud to blind visitors. Do not start with "A photo of".
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: Optional. A line of text shown under the photo.
          - label: Width in pixels
            name: width
            widget: number
            value_type: int
            required: false
            hint: Leave this empty. It is worked out automatically for photos uploaded here.
          - label: Height in pixels
            name: height
            widget: number
            value_type: int
            required: false
            hint: Leave this empty. It is worked out automatically for photos uploaded here.

      - label: YouTube video
        name: youtube
        widget: string
        required: false
        pattern: ['^\s*([A-Za-z0-9_-]{11}|https://(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)/\S+)\s*$', 'Paste the address of the video on YouTube, starting https://, or just the 11 letters and numbers after "watch?v=".']
        hint: >-
          Optional. Only for videos Cáirde Corrin made and put on its own YouTube
          channel. Paste the address of the video, for example
          https://www.youtube.com/watch?v=dQw4w9WgXcQ. The post shows a still from
          the video with a play button; nothing loads from YouTube until a visitor
          presses play.

      - label: Date last changed
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        required: false
        hint: >-
          Optional. Only fill this in if you make an important change to a post
          after it has been published.

  - name: gallery
    label: Gallery
    label_singular: photo
    description: >-
      Photographs for the Gallery page on the website. Add one with the button
      above. Nothing you add appears on the website until it is published.
    folder: site/_content/gallery
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: caption
    summary: "{{caption}}"
    sortable_fields: [taken, caption]
    fields:
      - label: Photo
        name: image
        widget: image
        media_library: { config: { max_file_size: 20000000 } }
        choose_url: false
        hint: >-
          Choose or upload a photo. Please use a photo you took yourself, or one
          you have permission to use. Photos straight from a phone are fine: the
          website makes smaller copies and removes the location the phone stored
          in them.
      - label: Describe the photo for people who cannot see it
        name: alt
        widget: string
        hint: >-
          One sentence saying what is in the photo. Screen readers read this aloud
          to blind visitors. Do not start with "A photo of".
      - label: Caption
        name: caption
        widget: string
        hint: >-
          A line of text shown under the photo, for example where it was taken or
          what it shows. The web address of the entry is made from this when you
          first save it.
      - label: Date taken
        name: taken
        widget: datetime
        format: YYYY-MM-DD
        date_format: D MMMM YYYY
        time_format: false
        picker_utc: true
        required: false
        hint: >-
          Optional. The day the photo was taken. Dated photos are shown newest
          first; photos without a date come after them.

  - name: home
    label: Home page
    description: >-
      Parts of the home page you can change. Nothing you change appears on the
      website until it is published.
    files:
      - name: social
        label: Social media posts
        file: site/_data/social.json
        fields:
          - label: Posts
            name: posts
            widget: list
            required: false
            max: 3
            label_singular: post
            summary: "{{fields.caption}}"
            hint: >-
              Up to three Instagram or Facebook posts to show on the home page, as
              cards that link to the post. Nothing is loaded from Instagram or
              Facebook: the card shows only the caption you type here. Leave the
              list empty and the home page shows no social section at all.
            fields:
              - label: Address of the post
                name: url
                widget: string
                pattern: ['^\s*https://(www\.|m\.)?(instagram\.com|facebook\.com)/\S+\s*$', 'Paste the full address of one Instagram or Facebook post, starting https://']
                hint: >-
                  Open the post, use Share, then Copy link, and paste it here. It
                  must be a post on Instagram or Facebook.
              - label: Caption
                name: caption
                widget: string
                pattern: ['^.{1,160}$', 'Keep the caption to one short line, under 160 characters.']
                hint: One short line saying what the post is about. This is what the card shows.
