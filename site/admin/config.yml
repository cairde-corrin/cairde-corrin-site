          - label: The links
            name: sites
            widget: list
            label_singular: link
            summary: "{{fields.name}}"
            hint: The sites listed on the Links page, in this order. Drag to reorder.
            fields:
              - { label: Name, name: name, widget: string }
              - label: Address
