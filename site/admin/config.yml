          - label: "Under \"Glenabo & Corrin\""
            name: p2
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"Glenabo & Corrin\""
            name: p3
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics. Figures such as heights, areas and distances are ordinary words: if you change one, change it on the other pages that give it too."
          - label: "Under \"Everything that falls here ends up in the Blackwater.\""
            name: p4
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"Same hill. Same morning.\""
            name: p5
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics. Figures such as heights, areas and distances are ordinary words: if you change one, change it on the other pages that give it too."
          - label: "Under \"One point on the Blackwater .\""
            name: p6
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics. Figures such as heights, areas and distances are ordinary words: if you change one, change it on the other pages that give it too."
          - label: "Under \"One point on the Blackwater .\""
            name: p7
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"Catchment, woodland and amenity inside one working boundary.\""
            name: p8
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"The three strands of our work are\""
            name: p9
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"Points of interest\""
            name: p10
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"New spaces\""
            name: p11
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"Improving water and ecosystems\""
            name: p12
            widget: text
            hint: "Plain text. Put *asterisks* round words to set them in italics."
          - label: "Under \"What 360 hectares actually looks like.\""
