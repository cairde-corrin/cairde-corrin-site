<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<!-- The editor's own Content Security Policy: everything from this site only. Looser than the
     public pages': Decap's config validator compiles code at runtime ('unsafe-eval'), Decap
     styles itself inline, and it shows uploads as blob: previews; see docs/SECURITY.md. The public pages get theirs at build time (_includes/csp.js). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://upload.wikimedia.org https://thumb.wikimedia.org; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data: https://commons.wikimedia.org; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>News editor - Cáirde Corrin</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<style>
/* Hides the top-bar Media button. It opens the media library outside any post, where
   uploads skip the 20 MB cap and the draft workflow and commit straight to main. Photos
   are added from a post's photo fields or the Image button instead. The selector is the
   label Decap gives that button (the Contents and Workflow links reuse its style, but are
   links, not buttons, and carry AppHeaderNavLink too). After updating Decap, check that
   Media is hidden and Contents and Workflow are not. */
button[class*="-AppHeaderButton"]:not([class*="-AppHeaderNavLink"]){display:none !important}
</style>
<script src="photos.js"></script>
<script src="tracks.js"></script>
<script src="audio.js"></script>
<script src="dem.js"></script>
<script src="checks.js"></script>
<script src="commons.js"></script>
<script src="editor.js"></script>
<!-- Both scripts are served from this site at pinned versions; nothing loads from a CDN.
     The widget must load first: Decap uses it to log editors in, and it picks up the
     invite and password-reset links in the address that the Netlify emails point here. -->
<script src="vendor/netlify-identity-widget-2.0.3/netlify-identity-widget.js"></script>
</head>
<body>
<script src="vendor/decap-cms-3.17.3/decap-cms.js"></script>
</body>
</html>
